    <script src="turn.js"></script>
    <script>
      $(document).ready(function () {
        // 1. Initialize the flipbook as you currently have it
        $(".flipbook").turn({
          autoCenter: true
        });

        // 2. Add the click event listener for the tabs
        $('.tabs .tab').on('click', function (event) {
          // Prevent the default link behavior
          event.preventDefault();

          // Get the target page number from the 'data-page' attribute
          var targetPage = $(this).data('page');

          // Navigate the flipbook to the target page using the Turn.js API
          $(".flipbook").turn("page", targetPage);

          // You can also add code here to change the active tab style
          // For example, remove the 'tab-active' class from all tabs and add it to the clicked one
          $('.tabs .tab').removeClass('tab-active');
          $(this).addClass('tab-active');
        });

        // 3. (Optional) Set the 'tab-active' class on page load
        // This will highlight the first tab (e.g., "Cover") when the page loads
        $('.tabs .tab[data-page="1"]').addClass('tab-active');

        // 4. (Optional) Update active tab when the page is turned manually
        $('.flipbook').bind('turned', function (event, page, view) {
          $('.tabs .tab').removeClass('tab-active');

          // Get the first visible page in the view and activate its corresponding tab
          var visiblePage = view[0] || view[1];
          if (visiblePage) {
            $('.tabs .tab[data-page="' + visiblePage + '"]').addClass('tab-active');
          }
        });

      });
    </script>
