<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Flipbook</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    /* Nav Bar */
    nav {
      background: #050a30;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      margin: 0;
      padding: 0;
    }

    nav ul li {
      margin-left: 20px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #ffcc00;
    }

    /* Flipbook container */
    .flipbook-container {
      max-width: 1000px;
      margin: 40px auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      padding: 10px;
      background: #fff;
    }
  </style>
</head>

<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo">St. Vincent Pallotti College of Engineering & Technology</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Events</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Flipbook Section -->
  <div class="flipbook-container">
    <a href="https://online.flippingbook.com/view/423239257/" class="fbo-embed" data-fbo-id="6040e73baf"
      data-fbo-ratio="3:2" data-fbo-lightbox="yes" data-fbo-width="100%" data-fbo-height="auto" data-fbo-version="1"
      style="max-width: 100%">MINDROID 2023-24.pdf</a>
    <script async defer src="https://online.flippingbook.com/EmbedScriptUrl.aspx?m=redir&hid=423239257"></script>
  </div>

</body>

</html>
